services:
  app:
    build: .
    ports:
      - 5000:5000
    volumes:
      - .:/crm
    environment:
      FLASK_DEBUG: 1
    command: flask run -h 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  adminer:
    image: adminer
    ports:
      - 8080:8080
volumes:
  db_data: